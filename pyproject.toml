[project]
name = "data-readyness-agent"
version = "0.1.0"
description = "An agent that checks data quality"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=1.3.10",
    "langchain-openai>=1.1.14",
    "python-dotenv>=1.2.0",
    "ipykernel>=7.1.0",
    "langchain-model-profiles>=0.0.4",
    "langchain-community>=0.4.1",
    "pypdf>=6.13.3",
    "langchain-text-splitters>=1.1.2",
    "mcp>=1.21.1",
    "langgraph>=1.0.3",
    "langgraph-cli>=0.4.9",
    "langgraph-api>=0.5.37",
    "ipywidgets>=8.1.8",
    "langsmith>=0.8.18",
    "langchain-core>=1.3.3",
    "streamlit>=1.60.0",
    "jupyterlab",
    "matplotlib",
    "seaborn"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find] 
include = ["src_data_readyness_agent*"]